<!doctype html>
<meta charset="utf-8">
<title>Topic Skipper settings</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin: 16px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 6px 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 6px 14px; }
  small { color: #666; }
  #msg { margin-left: 10px; }
</style>
<h2>Topic Skipper</h2>
<p>Stand-up splitting uses Claude. A one-hour special costs well under a cent with the default model, and results are cached per video.</p>
<label for="key">Anthropic API key</label>
<input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
<small>Stored only in this browser profile and sent only to api.anthropic.com.</small>
<label for="model">Model</label>
<input id="model" placeholder="claude-haiku-5-5">
<button id="save">Save</button><span id="msg"></span>
<button id="clear">Clear cached splits</button>
<script src="options.js"></script>
